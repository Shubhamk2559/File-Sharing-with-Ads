<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e0814">
<title>File</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!--AD_TAG-->
<style>
  :root {
    --bg: #0e0814;
    --surface: #1a1026;
    --ink: #fff4fa;
    --muted: #a893b8;
    --line: rgba(255, 244, 250, .12);
    --rose: #ff3b81;
    --amber: #ffb44d;
    --grad: linear-gradient(135deg, var(--rose), var(--amber));
    --err: #ff8a8a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(255, 59, 129, .22), transparent 60%),
      radial-gradient(100% 50% at 50% 115%, rgba(122, 60, 255, .20), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }
  main { width: 100%; max-width: 320px; text-align: center; }

  /* ---------- orb: ring + core ---------- */
  .icon { width: 96px; height: 96px; margin: 0 auto 28px; position: relative; }
  .icon::before {                       /* soft glow behind the ring */
    content: ""; position: absolute; inset: -14px; border-radius: 50%;
    background: var(--grad); filter: blur(28px); opacity: .38;
    transition: opacity .5s ease;
  }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255, 59, 129, 0) 0%, var(--rose) 55%, var(--amber) 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
    animation: spin 1.15s linear infinite;
  }
  .core {
    position: absolute; inset: 10px; border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, #2a1740, var(--surface) 70%);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    transition: background .4s ease, border-color .4s ease;
  }
  .core svg { grid-area: 1 / 1; width: 34px; height: 34px; fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transition: opacity .25s ease, transform .35s cubic-bezier(.3, 1.4, .5, 1); }
  .core svg.g-gem { width: 54px; height: 54px; stroke: none; filter: drop-shadow(0 4px 14px rgba(255, 40, 120, .7)); }
  .beat { transform-box: fill-box; transform-origin: center; animation: beat 1.8s ease-in-out infinite; }
  .tw2 { animation-delay: 1.1s; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.08); } }
  .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.6) rotate(0); } 50% { opacity: 1; transform: scale(1.1) rotate(45deg); } }
  .g-tick, .g-stop { opacity: 0; transform: scale(.6); }
  .g-tick path { stroke-dasharray: 30; stroke-dashoffset: 30; }

  .icon.done .ring { animation: none; background: var(--grad); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); }
  .icon.done .core { background: var(--grad); border-color: transparent; }
  .icon.done .g-gem { opacity: 0; transform: scale(.6); }
  .icon.done .g-tick { opacity: 1; transform: scale(1); stroke: #1a0b14; stroke-width: 2.4; }
  .icon.done .g-tick path { animation: draw .45s .15s ease forwards; }
  .icon.done::before { opacity: .6; }

  .icon.stop .ring { animation: none; background: var(--line); }
  .icon.stop::before { opacity: 0; }
  .icon.stop .g-gem { opacity: 0; transform: scale(.6); }
  .icon.stop .g-stop { opacity: 1; transform: scale(1); stroke: var(--err); }

  /* one-time burst when the file is delivered */
  .spark { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--grad); opacity: 0; }
  .icon.done .spark { animation: burst .8s .1s cubic-bezier(.2, .7, .3, 1) forwards; }
  .spark:nth-of-type(1) { --a: 0deg; } .spark:nth-of-type(2) { --a: 45deg; } .spark:nth-of-type(3) { --a: 90deg; } .spark:nth-of-type(4) { --a: 135deg; }
  .spark:nth-of-type(5) { --a: 180deg; } .spark:nth-of-type(6) { --a: 225deg; } .spark:nth-of-type(7) { --a: 270deg; } .spark:nth-of-type(8) { --a: 315deg; }
  @keyframes burst {
    0% { opacity: 1; transform: rotate(var(--a)) translateY(-48px) scale(1); }
    100% { opacity: 0; transform: rotate(var(--a)) translateY(-84px) scale(.3); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* ---------- copy ---------- */
  #status { margin: 0; min-height: 28px; font-size: 21px; line-height: 1.3; font-weight: 650; letter-spacing: -.02em; }
  #status.err { color: var(--err); }
  #status.load::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }
  #sub { margin: 8px 0 0; min-height: 20px; font-size: 14px; line-height: 1.5; color: var(--muted); }
  #progress { margin: 18px 0 0; min-height: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .dots { display: inline-flex; gap: 6px; }
  .dots b { width: 22px; height: 4px; border-radius: 2px; background: var(--line); }
  .dots b.on { background: var(--grad); }
  .dots b.now { background: linear-gradient(90deg, var(--rose), var(--amber)); opacity: .55; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 1; } }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-block; margin-top: 24px; padding: 13px 28px;
    border-radius: 999px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line); background: rgba(255, 244, 250, .06); color: var(--ink);
    transition: transform .12s ease, box-shadow .2s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
  .btn.solid { background: var(--grad); border-color: transparent; color: #1a0b14; box-shadow: 0 8px 26px rgba(255, 59, 129, .35); }
  .btn[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .ring { animation-duration: 3s; }
    #status.load::after, .dots b.now { animation: none; }
    .spark { display: none; }
    .tw, .beat { animation: none; }
  }
</style>
</head>
<body>
<main>
  <div class="icon" id="icon">
    <div class="ring"></div>
    <div class="core">
      <svg class="g-gem" viewBox="0 0 64 56" aria-hidden="true">
        <defs>
          <linearGradient id="lipU" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5c93"/><stop offset="1" stop-color="#c2155f"/></linearGradient>
          <linearGradient id="lipL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7aa8"/><stop offset=".55" stop-color="#f0276f"/><stop offset="1" stop-color="#b8104f"/></linearGradient>
          <radialGradient id="lipG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        </defs>
        <g class="beat">
          <path d="M3 28C12 22 18 13 26 13c3.2 0 5 1.8 6 4 1-2.2 2.8-4 6-4 8 0 14 9 23 15-10 2-20 3-29 3S13 30 3 28z" fill="url(#lipU)"/>
          <path d="M3 28c10 2 20 3 29 3s19-1 29-3c-5.5 13-16 20-29 20S8.5 41 3 28z" fill="url(#lipL)"/>
          <path d="M3 28c10 2 20 3 29 3s19-1 29-3" fill="none" stroke="#6a0a33" stroke-width="1.4" stroke-linecap="round"/>
          <ellipse cx="32" cy="39" rx="11" ry="3.6" fill="url(#lipG)"/>
          <ellipse cx="21" cy="19" rx="5" ry="1.8" fill="#fff" opacity=".45" transform="rotate(-24 21 19)"/>
          <ellipse cx="43" cy="19" rx="4" ry="1.5" fill="#fff" opacity=".3" transform="rotate(24 43 19)"/>
        </g>
        <path class="tw" d="M54 3v9M49.5 7.500h9" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
        <path class="tw tw2" d="M8 4v6M5 7h6" stroke="#ffd2e3" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="g-tick" viewBox="0 0 34 34"><path d="M9 17.5l5.5 5.5L25 11.5"/></svg>
      <svg class="g-stop" viewBox="0 0 34 34"><circle cx="17" cy="17" r="12"/><path d="M17 10.5v8M17 23h.01"/></svg>
    </div>
    <i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i>
    <i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="sub"></p>
  <div id="progress"></div>
  <button class="btn solid" id="watch" hidden>Watch ad</button>
  <button class="btn" id="retry" hidden>Try again</button>
  <button class="btn solid" id="recheck" hidden>Check again</button>
  <button class="btn solid" id="openbot" hidden>Open bot</button>
</main>

<script>
const CFG = __CFG__;
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
try { tg.setHeaderColor("#0e0814"); tg.setBackgroundColor("#0e0814"); } catch (e) {}
try { tg.setBottomBarColor("#0e0814"); } catch (e) {}

const qs = new URLSearchParams(location.search);
let sid = qs.get("sid") || null;                     // purana bot-button flow
const startParam = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let rewarded = false;
let askedWrite = false;
let runId = 0;                                       // har begin() ka token; purana run apne aap ruk jaata hai

const MAX_TRIES = 4;        // ad nahi mila to itni baar khud dobara try (user ko button nahi dabana padta)
const PRELOAD_S = 6;        // Monetag preload timeout (sec): ad pehle background me load, phir turant show
const QUICK_MS = 3000;      // is se jaldi fail hua = ad dikha hi nahi, safe hai dobara try karna

function setStatus(text, cls) {
  const el = $("status");
  el.textContent = text;
  el.className = cls || "";
}
function setSub(text) { $("sub").textContent = text || ""; }
function setProgress(done, required) {
  const el = $("progress");
  el.textContent = "";
  if (required > 1) {
    const cur = Math.min(done + 1, required);
    el.append("Ad " + cur + " of " + required);
    const d = document.createElement("span");
    d.className = "dots";
    for (let i = 0; i < required; i++) {
      const b = document.createElement("b");
      if (i < done) b.className = "on"; else if (i === cur - 1) b.className = "now";
      d.appendChild(b);
    }
    el.appendChild(d);
  }
}
function setIcon(state) {                              // "" | "stop" | "done"
  $("icon").className = "icon " + state;
}
function fail(msg, sub) {
  stopWatch();
  setStatus(msg, "err");
  setSub(sub || "");
  setIcon("stop");
  $("recheck").hidden = true;
  $("retry").hidden = false;
}

async function api(path, extra) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ sid: sid, init_data: tg.initData, ymid: curYmid }, extra || {})),
  });
  return r.json();
}

// ---------------- Ad blocker / Private DNS detection ----------------
// Idea: apna server (/api/ping) chal raha hai lekin Monetag ka host nahi => user ke device par AdBlock / Private DNS / VPN-blocker on hai.
// Network error (DNS NXDOMAIN, 0.0.0.0, connection refused) = "fail". Sirf slow hone par blocked nahi maante ("slow").
function probe(url, ms, cross) {
  return new Promise((resolve) => {
    const ctl = new AbortController();
    const t = setTimeout(() => { ctl.abort(); resolve("slow"); }, ms);
    const opts = cross
      ? { method: "HEAD", mode: "no-cors", cache: "no-store", credentials: "omit", referrerPolicy: "no-referrer", signal: ctl.signal }
      : { cache: "no-store", signal: ctl.signal };
    fetch(url, opts).then(
      () => { clearTimeout(t); resolve("ok"); },
      (e) => { clearTimeout(t); resolve(e && e.name === "AbortError" ? "slow" : "fail"); }
    );
  });
}
async function adsStatus() {                          // "ok" | "blocked" | "offline"
  const hosts = CFG.probe || [];
  const res = await Promise.all([probe("/api/ping", 7000, false)].concat(hosts.map((u) => probe(u, 7000, true))));
  if (res[0] === "fail") return "offline";
  return res.slice(1).indexOf("fail") >= 0 ? "blocked" : "ok";
}

let watchT = null, watchBusy = false;
function stopWatch() { if (watchT) { clearInterval(watchT); watchT = null; } }
function showBlocked() {
  stopWatch();
  setIcon("stop");
  setStatus("Ad blocker detected", "err");
  setSub("Please turn off your AdBlock, AdGuard / Private DNS, DNS filter or VPN, then tap Check again. Without ads you can't access the file.");
  $("progress").textContent = "Android: Settings \u2192 Network \u2192 Private DNS \u2192 Off";
  $("retry").hidden = true;
  $("openbot").hidden = true;
  const b = $("recheck");
  b.hidden = false; b.disabled = false; b.textContent = "I turned it off \u2014 Check again";
  // user setting badal kar wapas aaye to khud aage badh jaye
  watchT = setInterval(async () => {
    if (document.hidden || watchBusy) return;
    watchBusy = true;
    try { if ((await blockCheck()) === "ok") { stopWatch(); begin(); } } finally { watchBusy = false; }
  }, 6000);
}
$("recheck").addEventListener("click", async () => {
  const b = $("recheck");
  b.disabled = true; b.textContent = "Checking...";
  const st = await blockCheck();
  if (st === "ok") { stopWatch(); begin(); return; }
  b.disabled = false; b.textContent = "Check again";
  setSub(st === "offline"
    ? "No internet connection. Check your network and try again."
    : st === "slow" || st === "error"
      ? "Couldn't verify your connection. Please try again."
      : "Still blocked. Turn off AdBlock / Private DNS / VPN, then tap Check again.");
});
// Smart flow: full check = server-verified bait challenge + ad host probes + cosmetic bait (ads/guard.js). Needs a session (sid).
// Legacy / no-session: simple host probe. Returns "ok" | "blocked" | "offline" | "slow" | "error"
let G = null;                                         // window.SmartGuard once loaded
async function fullCheck(strict) {
  return G.check(G.browserEnv(window), { hosts: CFG.probe || [], api: sapi, strict: !!strict });
}
async function blockCheck() {
  if (CFG.smart && G && sid) { try { return (await fullCheck(true)).status; } catch (e) { return "error"; } }
  return adsStatus();
}
// Ad na dikhne par: pehle dekho ki wajah blocker hai ya nahi, warna normal error
async function failNoAd(msg, sub) {
  const st = await adsStatus();
  if (st === "blocked") { showBlocked(); return; }
  if (st === "offline") { fail("No internet connection. Please try again."); return; }
  fail(msg, sub);
}

// ---------------- Monetag SDK ----------------
// Script load hone par window.show_<ZONE> function ban jaata hai
function waitForSdk(ms, zone) {
  const fn = "show_" + (zone || CFG.zoneId);
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    (function check() {
      if (typeof window[fn] === "function") return resolve(window[fn]);
      if (window.__sdkErr) return reject(new Error("sdk blocked"));   // script load error: 12s na ruko
      if (Date.now() - t0 > ms) return reject(new Error("sdk missing"));
      setTimeout(check, 50);
    })();
  });
}
// SDK ready karo: pehle se loaded ho to wahi; fail hua tag ho to hata kar naya lagao (user ne DNS/AdBlock off kiya ho to bina reload chalega)
function ensureSdk(zone, url) {
  const fn = "show_" + zone;
  if (typeof window[fn] === "function") return Promise.resolve(window[fn]);
  const old = document.querySelector('script[data-zone="' + zone + '"]');
  if (window.__sdkErr || !old) {
    if (old) old.remove();
    window.__sdkErr = 0;
    const sc = document.createElement("script");
    sc.async = true; sc.src = url || CFG.sdk; sc.dataset.zone = zone; sc.dataset.sdk = fn;
    sc.onerror = () => { window.__sdkErr = 1; };
    document.head.appendChild(sc);
  }
  return waitForSdk(12000, zone);
}

let claimed = false, adRunning = false, adStartedAt = 0, watchdog = null;
let curYmid = null, curZone = CFG.zoneId;

function reportFail(reason) {            // sirf stats + auto-bench; reward par koi asar nahi
  try { return api("/api/ad/fail", { reason: reason }).catch(() => {}); } catch (e) { return Promise.resolve(); }
}
// No-fill grace: Monetag ke paas ad hi nahi (har retry "empty feed") aur AdBlock/DNS off hai => server file bina ad ke deta hai.
// Server khud apne records se empty_feed reports ginta hai; blocker wale user ko yahan tak pahunchne se pehle hi rok diya jaata hai.
async function tryGrace() {
  if (!CFG.grace) return false;
  if ((await adsStatus()) !== "ok") return false;
  let r;
  try { r = await api("/api/ad/grace"); } catch (e) { return false; }
  if (!r || !r.ok || !r.delivered) return false;
  setIcon("done");
  setStatus("Sent! Check your chat.");
  setSub("This window will close on its own");
  $("progress").textContent = "";
  setTimeout(() => tg.close(), 1600);
  return true;
}
function failReason(e) {
  const m = String(errText(e) || "");
  if (/empty feed/i.test(m)) return "empty_feed";
  if (/timeout/i.test(m)) return "timeout";
  return "error";
}

const LOG = [];
function log(msg) {
  const t = adStartedAt ? ((Date.now() - adStartedAt) / 1000).toFixed(1) : "0.0";
  LOG.push("+" + t + "s " + msg);
  if (CFG.showLog) {
    let el = $("log");
    if (!el) { el = document.createElement("pre"); el.id = "log"; el.style.cssText = "font-size:10px;text-align:left;white-space:pre-wrap;color:var(--muted);margin-top:16px"; document.querySelector("main").appendChild(el); }
    el.textContent = LOG.join("\n");
  }
}

function errText(e) {
  if (!e) return "";
  if (typeof e === "string") return e;
  return e.message || e.error || e.reason || (function () { try { return JSON.stringify(e); } catch (_) { return ""; } })();
}

// Ad pehle background me load (Monetag docs: type "preload"), taaki show() turant chale.
// {ok:true} = ready (ya preload supported nahi, seedha show karo) | {ok:false, why} = ad nahi mila
function preloadAd(show, ymid) {
  return new Promise((resolve) => {
    let p;
    try { p = show({ type: "preload", ymid: ymid, timeout: PRELOAD_S }); }
    catch (e) { log("preload throw " + errText(e)); resolve({ ok: true, skipped: true }); return; }
    if (!p || typeof p.then !== "function") { resolve({ ok: true, skipped: true }); return; }
    const guard = setTimeout(() => resolve({ ok: false, why: "timeout" }), (PRELOAD_S + 3) * 1000);
    p.then(
      () => { clearTimeout(guard); log("preloaded"); resolve({ ok: true }); },
      (e) => { clearTimeout(guard); log("preload rejected: " + errText(e)); resolve({ ok: false, why: failReason(e), msg: errText(e) }); }
    );
  });
}

// Resolves {done:true} (ad poora, claim shuru) ya {done:false, why, quick, msg}
function playAd(show) {
  return new Promise((resolve) => {
    if (adRunning) { resolve({ done: false, why: "busy", quick: false }); return; }
    adRunning = true; claimed = false;
    $("watch").hidden = true;
    setIcon("");
    setStatus("Ad is playing", "load");
    setSub("Watch till the end to unlock your file");
    adStartedAt = Date.now();
    log("show() called, zone " + curZone);

    // ad kabhi respond hi na kare to user atka na rahe
    clearTimeout(watchdog);
    watchdog = setTimeout(() => {
      if (claimed) return;
      adRunning = false;
      log("watchdog: no response");
      resolve({ done: false, why: "timeout", quick: false });
    }, 60000);

    let p;
    try { p = show({ ymid: curYmid, requestVar: "unlock" }); }
    catch (e) { clearTimeout(watchdog); adRunning = false; log("throw " + errText(e)); resolve({ done: false, why: "error", quick: true }); return; }

    Promise.resolve(p).then((result) => {
      // Monetag docs: promise "ad band hone ke baad" resolve hota hai; paid hua ya nahi = result.reward_event_type.
      // Asli enforcement server par hota hai (AD_VERIFY_MODE=postback); yeh client check sirf honest UX ke liye.
      log("ad closed (resolved) " + (result && result.reward_event_type ? result.reward_event_type : "no-result"));
      clearTimeout(watchdog);
      adRunning = false;
      if (claimed) return;
      if (CFG.blockNonValued && result && result.reward_event_type === "non_valued") {
        resolve({ done: false, why: "non_valued", quick: false });
        return;
      }
      claimed = true;
      claim();
      resolve({ done: true });
    }).catch((e) => {
      clearTimeout(watchdog);
      adRunning = false;
      const why = errText(e);
      log("rejected: " + why);
      resolve({ done: false, why: failReason(e), quick: Date.now() - adStartedAt < QUICK_MS, msg: why });
    });
  });
}

async function claim() {
  setStatus("Verifying", "load");
  setSub("Confirming your ad view");
  let r;
  try { r = await api("/api/ad/done"); }
  catch (e) { rewarded = false; fail("Network error. Please try again."); return; }

  if (r.wait) { setTimeout(claim, r.wait * 1000 + 300); return; }
  if (!r.ok) { rewarded = false; fail(r.error || "Verification failed."); return; }

  setProgress(r.ads_done, r.ads_required);
  if (r.delivered) {
    setIcon("done");
    setStatus("Sent! Check your chat.");
    setSub("This window will close on its own");
    $("progress").textContent = "";
    setTimeout(() => tg.close(), 1600);
  } else {
    rewarded = false;
    begin();
  }
}

// The bot isn't allowed to message this user yet
function needWrite(bot) {
  if (!askedWrite && typeof tg.requestWriteAccess === "function") {
    askedWrite = true;
    setStatus("Waiting for permission", "load");
    setSub("Allow the bot to send you the file");
    tg.requestWriteAccess((ok) => { if (ok) begin(); else showBot(bot); });
  } else {
    showBot(bot);
  }
}
function showBot(bot) {
  setIcon("stop");
  setStatus("Start the bot first");
  setSub("Open the bot once, then your file will arrive in the chat.");
  const b = $("openbot");
  b.hidden = false;
  b.onclick = () => {
    tg.openTelegramLink("https://t.me/" + bot + "?start=" + encodeURIComponent(startParam));
    tg.close();
  };
}

const HINT_DNS = "If you use AdBlock, AdGuard or Private DNS, turn it off and try again.";

// ---------------- original Monetag flow (auto-retry + preload) ----------------
async function legacyBegin(run) {
  const alive = () => run === runId;
  const sdkDefault = ensureSdk(CFG.zoneId, CFG.sdk).catch(() => null);   // default zone ka SDK start ke saath hi load
  let lastWhy = "";
  let clicked = false;
  for (let attempt = 1; attempt <= MAX_TRIES; attempt++) {
    if (attempt > 1) {
      setIcon(""); setStatus("Loading your ad", "load");
      setSub("Finding an ad for you (" + attempt + "/" + MAX_TRIES + ")");
      await sleep(300 * attempt);
      if (!alive()) return;
    }
    let s;
    try { s = await api("/api/ad/start"); }       // har attempt par naya ymid (Monetag: unique ymid per ad show)
    catch (e) { if (alive()) fail("Network error. Please try again."); return; }
    if (!alive()) return;
    if (s.code === "no_write") { needWrite(s.bot); return; }
    if (!s.ok) { fail(s.error || "Session expired."); return; }

    sid = s.sid;
    curYmid = s.ymid || null;
    curZone = s.zone || CFG.zoneId;
    setProgress(s.ads_done, s.ads_required);

    const show = await (curZone === CFG.zoneId ? sdkDefault : ensureSdk(curZone, s.sdk).catch(() => null));
    if (!alive()) return;
    if (!show) {
      reportFail(window.__sdkErr ? "blocked" : "timeout");
      await failNoAd("The ad script didn't load. Please check your connection and try again.", HINT_DNS);
      return;
    }

    const pre = await preloadAd(show, curYmid);
    if (!alive()) return;
    if (!pre.ok && pre.why !== "error") {          // empty feed / timeout: ad nahi hai, khud dobara
      lastWhy = pre.why;
      await reportFail(pre.why);
      if (attempt < MAX_TRIES) continue;
      if (pre.why === "empty_feed" && await tryGrace()) return;
      await failNoAd("No ad is available right now. Please try again in a moment.", pre.why === "timeout" ? HINT_DNS : "");
      return;
    }
    // preload "error" (SDK purana ho sakta hai) to bhi seedha show karke dekho

    // Ad ready hai: user button dabaye tab turant chalao (ek baar dabane ke baad retries khud chalte hain)
    if (CFG.clickPlay && !clicked) {
      setIcon(""); setStatus("Your file is ready");
      setSub("Tap below to watch a short ad and unlock it");
      const b = $("watch");
      b.textContent = "Watch ad & unlock"; b.hidden = false;
      const readyAt = Date.now();
      await new Promise((res) => { b.onclick = res; });
      clicked = true;
      b.hidden = true;
      if (!alive()) return;
      if (Date.now() - readyAt > 45000) {          // bahut der ruka: preloaded ad purana ho sakta hai, dobara taza preload
        setStatus("Loading your ad", "load");
        const p2 = await preloadAd(show, curYmid);
        if (!alive()) return;
        if (!p2.ok && p2.why !== "error" && attempt < MAX_TRIES) { reportFail(p2.why); continue; }
      }
    }

    const r = await playAd(show);
    if (!alive()) return;
    if (r.done) return;
    if (r.why === "non_valued") { reportFail("non_valued"); fail("That ad didn't count. Please try again."); return; }
    lastWhy = r.why;
    await reportFail(r.why);
    if (r.quick && attempt < MAX_TRIES) continue;   // ad dikha hi nahi tha: user ko pata chale bina retry
    if (r.why === "empty_feed" && await tryGrace()) return;
    await failNoAd("No ad could be shown right now" + (CFG.showLog && r.msg ? " (" + String(r.msg).slice(0, 80) + ")" : "") + ". Please try again shortly.", r.why === "empty_feed" ? "" : HINT_DNS);
    return;
  }
}

// ---------------- smart multi-network flow (only used when CFG.smart) ----------------
// Always resolves to an object {ok, code?, error?, ...}; never leaves the UI guessing.
// Categories: network | timeout | http_<status> | bad_response | validation_error | session | ... (server-provided)
const SAPI_TIMEOUT_MS = 20000;
async function sapi(path, extra) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), SAPI_TIMEOUT_MS);
  try {
    const r = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ sid: sid, init_data: tg.initData }, extra || {})),
      signal: ctl.signal,
    });
    let j = null;
    try { j = await r.json(); } catch (e) { /* non-JSON body */ }
    if (j && typeof j === "object" && !Array.isArray(j) && ("ok" in j)) return j;
    if (!j) return { ok: false, code: "bad_response", error: "The server sent an unreadable response (HTTP " + r.status + "). Please try again." };
    return { ok: false, code: "http_" + r.status, error: "The server rejected the request (HTTP " + r.status + "). Please try again." };
  } catch (e) {
    if (e && e.name === "AbortError") return { ok: false, code: "timeout", error: "The server took too long to respond. Please try again." };
    return { ok: false, code: "network", error: "Network error. Please check your connection and try again." };
  } finally {
    clearTimeout(timer);
  }
}
function smartError(r, fallback) {      // never claim "Session expired" unless the server said so
  return (r && r.error) || ((r && r.code) ? fallback + " (" + r.code + ")" : fallback);
}
function loadScriptTag(src) {
  return new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = src; sc.onload = () => res(); sc.onerror = () => rej(new Error(src));
    document.head.appendChild(sc);
  });
}
function loadSmartLib() {              // adapters + guard are fetched only when needed (neutral paths: ad blockers block "/ads/")
  if (window.SmartAds && window.SmartGuard) { G = window.SmartGuard; return Promise.resolve(window.SmartAds); }
  return Promise.all([loadScriptTag("/assets/sa.js"), loadScriptTag("/assets/sg.js")]).then(() => { G = window.SmartGuard; return window.SmartAds; });
}
function showSent() {
  setIcon("done");
  setStatus("Sent! Check your chat.");
  setSub("This window will close on its own");
  $("progress").textContent = "";
  setTimeout(() => tg.close(), 1600);
}
// All rounds ended without ANY ad being displayed. Server decides: ad-blocker challenge must pass, otherwise no file.
async function giveUp(run, out, t0) {
  const alive = () => run === runId;
  const gate = CFG.gate || {};
  if (out.reason === "blocked" || out.sawBlocked) { showBlocked(); return; }   // an ad script was blocked / neutered on this device
  if (!gate.grace) { await failNoAd("No ad is available right now. Please try again shortly.", HINT_DNS); return; }
  setIcon(""); setStatus("Checking your device", "load");
  setSub("No ad is available right now. Making sure nothing is blocking ads.");
  for (let i = 0; i < 3; i++) {
    const g = await fullCheck(true);
    if (!alive()) return;
    if (g.status === "blocked") { showBlocked(); return; }
    if (g.status === "offline") { fail("No internet connection. Please try again."); return; }
    if (g.status !== "ok") { fail("Couldn't verify your connection. Please try again."); return; }
    const r = await sapi("/api/smart/grace", { cid: g.cid, proofs: g.proofs, cosmetic: g.cosmetic, tamper: g.tamper });
    if (!alive()) return;
    if (r.ok && r.delivered) { showSent(); return; }
    if (r.code === "too_soon" && i < 2) { await sleep(Math.min(15, r.wait || 3) * 1000); if (!alive()) return; continue; }   // fresh challenge after the pause
    if (r.code === "blocker") { showBlocked(); return; }
    fail(smartError(r, "Couldn't unlock the file"));
    return;
  }
  fail("Couldn't verify your connection. Please try again.");
}
async function smartBegin(run) {
  const alive = () => run === runId;
  const stP = adsStatus();                         // lib load ke saath parallel
  let S;
  try { S = await loadSmartLib(); } catch (e) { if (alive()) fail("Couldn't load. Please check your connection and try again."); return; }
  // Gate: ad host unreachable => ad slot lene se pehle hi block screen (slot lock na lage)
  let st = await stP;
  if (!alive()) return;
  if (st === "ok" && !(await G.browserEnv(window).cosmetic())) st = "blocked";      // cosmetic filters (hidden ad containers)
  if (!alive()) return;
  if (st === "blocked") { showBlocked(); return; }
  if (st === "offline") { fail("No internet connection. Please try again."); return; }

  const adapters = S.createAdapters(S.browserEnv(window));
  let out = null;
  const ROUNDS = Math.max(1, (CFG.gate && CFG.gate.rounds) || 3);     // each round = Monetag, then Tads.me as fallback
  const t0 = Date.now();
  for (let attempt = 0; attempt < ROUNDS; attempt++) {
    if (attempt) {
      setIcon(""); setStatus("Loading your ad", "load");
      setSub("Finding an ad for you (" + (attempt + 1) + "/" + ROUNDS + ")");
      await sleep(400 * attempt + 300);
      if (!alive()) return;
    }
    const s = await sapi("/api/smart/start");
    if (!alive()) return;
    if (s.code === "no_write") { needWrite(s.bot); return; }
    if (!s.ok) { fail(smartError(s, "Couldn't start the ad")); return; }
    sid = s.sid;
    setProgress(s.ads_done, s.ads_required);
    out = await S.runChain(s, adapters, sapi, {
      loading: () => { setStatus("Loading your ad", "load"); setSub("One short ad unlocks your file"); },
      shown: () => { setStatus("Ad is playing", "load"); setSub("Watch till the end to unlock your file"); },
    });
    if (!alive()) return;
    if (out.kind === "completed" || out.kind === "skipped" || out.displayed) break;   // ad dikha ho to dusra mat chalao
  }
  if (out.kind === "skipped") { fail("The ad was closed before the end. Please try again."); return; }
  if (out.kind !== "completed") {
    if (out.displayed) { fail("The ad was interrupted. Please try again."); return; }
    await giveUp(run, out, t0);
    return;
  }
  setStatus("Verifying", "load");
  setSub("Confirming your ad view");
  let r;
  try { r = await S.claim(out.state, out.res, sapi, (ms) => new Promise((x) => setTimeout(x, ms))); }
  catch (e) { fail("Network error. Please try again."); return; }
  if (!r.ok) { fail(smartError(r, "Verification failed")); return; }
  setProgress(r.ads_done, r.ads_required);
  if (r.delivered) {
    showSent();
  } else {
    begin();                           // more ads required: one new request, still one ad at a time
  }
}

async function begin() {
  const run = ++runId;
  stopWatch();
  $("retry").hidden = true;
  $("openbot").hidden = true;
  $("recheck").hidden = true;
  $("watch").hidden = true;
  setIcon("");
  rewarded = false;
  if (!tg.initData) { fail("Please open this inside Telegram."); return; }
  if (!sid && !startParam) {                       // file link ke bina khola (jaise moderator/reviewer): error nahi, normal home screen
    setIcon("done");
    setStatus("Welcome!");
    setSub("Open any file link to receive your file here in the chat.");
    $("progress").textContent = "";
    const b = $("openbot"); b.textContent = "Close"; b.hidden = false; b.onclick = () => tg.close();
    return;
  }
  setStatus("Loading your ad", "load");
  setSub("One short ad unlocks your file");

  if (!CFG.smart) {
    // Blocker check ad load ke saath parallel (koi extra wait nahi). Blocked mila aur ad abhi chala nahi => turant block screen.
    adsStatus().then((st) => {
      if (run === runId && st === "blocked" && !adRunning && !claimed) { runId++; showBlocked(); }
    });
    legacyBegin(run);
  } else {
    smartBegin(run);   // multi-network flow (SMART_ADS_ENABLED)
  }
}

$("retry").addEventListener("click", begin);
begin();   // the ad starts as soon as the mini app opens, no extra button
</script>
